<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Prism gradients -->
    <linearGradient id="prismFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4650a8" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1b2242" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="prismStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000078"/>
      <stop offset="100%" stop-color="#8888cc"/>
    </linearGradient>

    <!-- Output beam gradients -->
    <linearGradient id="beamCyan" x1="168" y1="118" x2="256" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beamGreen" x1="168" y1="128" x2="256" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ff99" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#00ff99" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beamRed" x1="168" y1="138" x2="256" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-15%" y="-25%" width="130%" height="150%">
      <feGaussianBlur stdDeviation="1.9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="microBoost" x="-5%" y="-10%" width="110%" height="120%">
      <feGaussianBlur stdDeviation="0.55" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main container, shifted slightly left -->
  <g transform="translate(-8, 0)">

    <!-- Input waveform -->
    <g filter="url(#glow)" fill="none" stroke-linecap="round">
      <path d="M 14,128 c 12,-20 24,24 36,0 c 11,-18 22,22 33,0 h 4"
            stroke="#cfd3e6" stroke-opacity="0.82" stroke-width="5.5"/>
      <path d="M 14,128 H 87"
            stroke="#ffffff" stroke-opacity="0.16" stroke-width="4"
            stroke-dasharray="2, 10"/>
      <circle cx="21" cy="128" r="2.3" fill="#cfd3e6" fill-opacity="0.8"/>
      <circle cx="35" cy="122" r="2.3" fill="#cfd3e6" fill-opacity="0.8"/>
      <circle cx="49" cy="135" r="2.3" fill="#cfd3e6" fill-opacity="0.8"/>
      <circle cx="63" cy="121" r="2.3" fill="#cfd3e6" fill-opacity="0.8"/>
      <circle cx="77" cy="136" r="2.3" fill="#cfd3e6" fill-opacity="0.8"/>
    </g>

    <!-- Output beams (spectral decomposition) -->
    <g filter="url(#glow)" fill="none" stroke-linecap="round">
      <path d="M 168,118 C 190,104 206,128 222,114 C 238,100 246,112 254,102"
            stroke="url(#beamCyan)" stroke-width="9"/>
      <path d="M 168,128 C 192,128 206,110 228,128 C 244,146 248,136 254,128"
            stroke="url(#beamGreen)" stroke-width="9"/>
      <path d="M 168,138 C 192,156 212,160 234,148 C 246,142 250,146 254,150"
            stroke="url(#beamRed)" stroke-width="9"/>
    </g>

    <!-- SIMD ticks / parallel processing indicators -->
    <g stroke="#5a6080" stroke-opacity="0.6" stroke-width="3.5" stroke-linecap="round">
      <path d="M 196,110 L 196,124"/>
      <path d="M 212,106 L 212,120"/>
      <path d="M 228,104 L 228,118"/>
      <path d="M 196,132 L 196,146"/>
      <path d="M 214,130 L 214,144"/>
      <path d="M 232,130 L 232,144"/>
    </g>

    <!-- Spectrum bars -->
    <g fill="#5a6080" fill-opacity="0.55">
      <rect x="238" y="84" width="7" height="24" rx="2"/>
      <rect x="248" y="74" width="7" height="34" rx="2"/>
      <rect x="238" y="112" width="7" height="18" rx="2"/>
      <rect x="248" y="110" width="7" height="22" rx="2"/>
      <rect x="238" y="142" width="7" height="26" rx="2"/>
      <rect x="248" y="146" width="7" height="22" rx="2"/>
    </g>

    <!-- Output sampling dots -->
    <g fill="#5a6080" fill-opacity="0.45" filter="url(#microBoost)">
      <circle cx="186" cy="118" r="2.2"/>
      <circle cx="206" cy="128" r="2.2"/>
      <circle cx="226" cy="138" r="2.2"/>
      <circle cx="244" cy="128" r="2.2"/>
    </g>

    <!-- Prism (upright equilateral triangle) -->
    <polygon
      points="128,38 42,212 214,212"
      fill="url(#prismFront)"
      stroke="url(#prismStroke)"
      stroke-width="1.5"/>

  </g>
</svg>
